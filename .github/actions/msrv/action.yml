name: Check MSRV
description:
  Check the MSRV (aka `rust-version`) in `Cargo.toml` is valid. Assumes the
  repo is already checked out and a Rust toolchain with caching is already
  set up, e.g. via `actions-rust-lang/setup-rust-toolchain`. Does not
  currently work with Cargo workspaces, see
  https://github.com/argumentcomputer/ci-workflows/issues/8

inputs:
  packages:
    description: List of prerequisite Ubuntu packages, separated by whitespace
    required: false
    default: ''
runs:
  using: composite
  steps:
    - uses: $/.github/actions/install-deps
      if: inputs.packages != ''
      with:
        packages: "${{ inputs.packages }}"
    - name: Install cargo-msrv
      shell: bash
      run: cargo install cargo-msrv
    - name: Check Rust MSRV
      shell: bash
      run: cargo msrv verify
