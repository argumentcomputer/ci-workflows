# Assumes the repo under test is already checked out.
name: Lint workflows

description: >-
  Run actionlint, shellcheck, zizmor and pinact over a repo's workflows and
  composite actions

inputs:
  # actionlint pipes every `run:` block through shellcheck, whose info- and
  # style-level findings are mostly noise in workflow scripts.
  shellcheck-severity:
    description: 'Minimum shellcheck severity actionlint reports: error, warning, info, or style'
    required: false
    default: 'warning'
  # Left empty, zizmor discovers `.github/zizmor.yml` in the repo being linted.
  zizmor-config:
    description: 'Path to a zizmor config file'
    required: false

runs:
  using: composite
  steps:
    - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
      env:
        SHELLCHECK_OPTS: -S ${{ inputs.shellcheck-severity }}
      with:
        # actionlint doesn't know the `$/` self-repository syntax yet and
        # misparses it as {owner}/{repo}@{ref}
        flags: -ignore 'specifying action "\$/.+" in invalid format'
    - name: Shellcheck composite action scripts
      shell: bash
      env:
        SEVERITY: ${{ inputs.shellcheck-severity }}
        ACTION_PATH: ${{ github.action_path }}
      run: python3 "$ACTION_PATH/shellcheck_actions.py"
    # `fix: false` implies `skip_push`, so this only reports: no git
    # commands, no write permissions. `verify` additionally rejects a
    # pinned SHA whose version comment names a different release.
    - uses: suzuki-shunsuke/pinact-action@896d595f299e71d65b9d28349d6956abe144390a # v3.0.0
      with:
        fix: "false"
        verify: "true"
    # Note that `continue-on-error` is silently ignored on composite action
    # steps, so any zizmor finding fails the calling job. Suppress findings
    # that don't apply via `.github/zizmor.yml` or `# zizmor: ignore` comments.
    - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
      with:
        config: ${{ inputs.zizmor-config }}
        # Mutually exclusive with `annotations`; the Security tab needs
        # `security-events: write` from the calling job.
        advanced-security: false
        annotations: true
