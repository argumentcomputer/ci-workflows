name: Check documentation links

on:
  workflow_call:
    inputs:
      # Whether or not to error on failure
      # If false, opens an issue instead
      fail-fast:
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linkChecker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2.9.0
        with:
          fail: ${{ inputs.fail-fast }}
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      # lychee stopped exporting `lychee_exit_code` to the environment in v2;
      # the exit code is only available as a step output.
      - name: Open issue on failure if `fail-fast` input is false
        if: steps.lychee.outputs.exit_code != 0 && inputs.fail-fast != true
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue
