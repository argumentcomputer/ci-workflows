# Smoke tests for this repo's composite actions
name: Test actions

on:
  push:
    branches: main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Exercises the create/update/invalid-input paths against a stub `gh` that
  # records its calls, so no real issues are touched
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stub gh
        run: |
          mkdir -p "$RUNNER_TEMP/stub-bin"
          cat > "$RUNNER_TEMP/stub-bin/gh" <<'EOF'
          #!/usr/bin/env bash
          echo "gh $*" >> "$GH_CALL_LOG"
          case "$1 $2" in
            "issue list") cat "$GH_ISSUES" ;;
            "issue create") echo "https://github.com/example/repo/issues/1" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/stub-bin/gh"
          echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"
          echo "GH_CALL_LOG=$RUNNER_TEMP/gh-calls.log" | tee -a "$GITHUB_ENV"
          echo "GH_ISSUES=$RUNNER_TEMP/issues.json" | tee -a "$GITHUB_ENV"
          echo "[]" > "$RUNNER_TEMP/issues.json"
      - name: Create a new issue
        uses: $/.github/actions/create-issue
        with:
          title: Test issue
          labels: test-label
          body: Test body
      - name: Update an existing issue with the same title
        run: |
          echo '[{"number": 7, "title": "Test issue"}, {"number": 9, "title": "other"}]' > "$GH_ISSUES"
      - uses: $/.github/actions/create-issue
        with:
          title: Test issue
          body: Updated body
      - name: Reject setting both body and body-file
        id: invalid
        continue-on-error: true
        uses: $/.github/actions/create-issue
        with:
          title: Test issue
          body: Test body
          body-file: README.md
      - name: Assert recorded gh calls
        env:
          INVALID_OUTCOME: ${{ steps.invalid.outcome }}
        run: |
          cat "$GH_CALL_LOG"
          set -x
          [[ "$INVALID_OUTCOME" == failure ]]
          grep -qF -- "issue create --repo $GITHUB_REPOSITORY --title Test issue --body Test body" "$GH_CALL_LOG"
          grep -qF -- "issue edit https://github.com/example/repo/issues/1 --repo $GITHUB_REPOSITORY --add-label test-label" "$GH_CALL_LOG"
          grep -qF -- "issue edit 7 --repo $GITHUB_REPOSITORY --body Updated body" "$GH_CALL_LOG"
          # The invalid input errors out before any gh call, so only the two
          # earlier action runs listed issues
          [[ "$(grep -cF -- "issue list" "$GH_CALL_LOG")" == 2 ]]

  # Runs the Rust CI actions on a generated fixture crate via the documented
  # caller pattern: checkout, then toolchain setup, then the action
  rust-actions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Generate fixture crate
        run: cargo init --lib --name fixture .
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          # Don't save caches from test fixtures
          cache: false
      - uses: $/.github/actions/lints
      - uses: $/.github/actions/wasm
      - uses: $/.github/actions/unused-deps

  # An up-to-date pin must not open an issue; an outdated pin must open one
  # with the parsed versions. Issue calls go to the same stub `gh` as above.
  rust-version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stub gh
        run: |
          mkdir -p "$RUNNER_TEMP/stub-bin"
          cat > "$RUNNER_TEMP/stub-bin/gh" <<'EOF'
          #!/usr/bin/env bash
          echo "gh $*" >> "$GH_CALL_LOG"
          case "$1 $2" in
            "issue list") echo "[]" ;;
            "issue create") echo "https://github.com/example/repo/issues/1" ;;
          esac
          EOF
          chmod +x "$RUNNER_TEMP/stub-bin/gh"
          echo "$RUNNER_TEMP/stub-bin" >> "$GITHUB_PATH"
          echo "GH_CALL_LOG=$RUNNER_TEMP/gh-calls.log" | tee -a "$GITHUB_ENV"
      - name: Pin an up-to-date toolchain
        run: printf '[toolchain]\nchannel = "stable"\n' > rust-toolchain.toml
      - uses: $/.github/actions/rust-version-check
      - name: Pin an outdated toolchain
        run: |
          printf '[toolchain]\nchannel = "1.70.0"\n' > rust-toolchain.toml
          # Install it so `rustup show` reports it as the active version
          rustup toolchain install 1.70.0 --profile minimal
      - uses: $/.github/actions/rust-version-check
      - name: Assert only the outdated pin opened an issue
        run: |
          touch "$GH_CALL_LOG"
          cat "$GH_CALL_LOG"
          set -x
          [[ "$(grep -cF -- "issue create" "$GH_CALL_LOG")" == 1 ]]
          grep -qF -- "issue create --repo $GITHUB_REPOSITORY --title chore: rust toolchain needs an upgrade" "$GH_CALL_LOG"
          # The parsed toolchain version made it into the issue body
          grep -qF -- "(1.70.0)" "$GH_CALL_LOG"

  # An up-to-date pin leaves both files alone; an outdated pin moves the
  # channel and the fenix hash to the latest stable. The expected hash is
  # recomputed here independently of the action's own code.
  rust-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pin an up-to-date toolchain with a placeholder fenix hash
        run: |
          printf '[toolchain]\nchannel = "stable"\n' > rust-toolchain.toml
          cat > flake.nix <<'EOF'
          {
            rustToolchain = fenix.packages.x86_64-linux.fromToolchainFile {
              file = ./rust-toolchain.toml;
              sha256 = "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=";
            };
          }
          EOF
      - uses: $/.github/actions/rust-version
        id: current
        with:
          update-flake: 'true'
      - name: Assert an up-to-date pin is left alone
        env:
          CHANNEL: ${{ steps.current.outputs.channel }}
          OUTDATED: ${{ steps.current.outputs.outdated }}
        run: |
          set -x
          [[ "$CHANNEL" == stable ]]
          [[ "$OUTDATED" != true ]]
          grep -qF 'channel = "stable"' rust-toolchain.toml
          grep -qF 'sha256-AAAA' flake.nix
      - name: Pin an outdated toolchain
        run: |
          printf '[toolchain]\nchannel = "1.70.0"\n' > rust-toolchain.toml
          # Install it so `rustup show` reports it as the active version
          rustup toolchain install 1.70.0 --profile minimal
      - uses: $/.github/actions/rust-version
        id: outdated
        with:
          update-flake: 'true'
      - name: Assert the channel and fenix hash moved to the latest stable
        env:
          OUTDATED: ${{ steps.outdated.outputs.outdated }}
          OLD_VERSION: ${{ steps.outdated.outputs.old-version }}
          NEW_VERSION: ${{ steps.outdated.outputs.new-version }}
          NIX_HASH: ${{ steps.outdated.outputs.nix-hash }}
        run: |
          set -x
          [[ "$OUTDATED" == true ]]
          [[ "$OLD_VERSION" == 1.70.0 ]]
          [[ "$NEW_VERSION" == "$(rustc +stable --version | awk '{ print $2 }')" ]]
          grep -qF "channel = \"$NEW_VERSION\"" rust-toolchain.toml
          expected="sha256-$(curl -fsSL "https://static.rust-lang.org/dist/channel-rust-$NEW_VERSION.toml" | openssl dgst -sha256 -binary | base64 -w0)"
          [[ "$NIX_HASH" == "$expected" ]]
          grep -qF "sha256 = \"$expected\"" flake.nix
      # A nightly pin stays on the nightly channel, moving to the latest date
      - name: Pin an outdated nightly
        run: |
          printf '[toolchain]\nchannel = "nightly-2025-01-01"\n' > rust-toolchain.toml
          rustup toolchain install nightly-2025-01-01 --profile minimal
      - uses: $/.github/actions/rust-version
        id: nightly
      - name: Assert the channel moved to the latest nightly
        env:
          CHANNEL: ${{ steps.nightly.outputs.channel }}
          OUTDATED: ${{ steps.nightly.outputs.outdated }}
          OLD_VERSION: ${{ steps.nightly.outputs.old-version }}
          NEW_VERSION: ${{ steps.nightly.outputs.new-version }}
        run: |
          set -x
          [[ "$CHANNEL" == nightly ]]
          [[ "$OUTDATED" == true ]]
          [[ "$OLD_VERSION" == 2025-01-01 ]]
          [[ "$NEW_VERSION" == "$(rustc +nightly --version | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}')" ]]
          grep -qF "channel = \"nightly-$NEW_VERSION\"" rust-toolchain.toml
      # A beta pin is on neither supported channel and must fail before any edit
      - name: Pin beta
        run: printf '[toolchain]\nchannel = "beta"\n' > rust-toolchain.toml
      - uses: $/.github/actions/rust-version
        id: beta
        continue-on-error: true
      - name: Assert the beta pin was rejected untouched
        env:
          BETA_OUTCOME: ${{ steps.beta.outcome }}
        run: |
          set -x
          [[ "$BETA_OUTCOME" == failure ]]
          grep -qF 'channel = "beta"' rust-toolchain.toml
