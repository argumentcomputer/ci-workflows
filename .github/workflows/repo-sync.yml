name: Sync changes from upstream repo

on:
  workflow_call:
    inputs:
      # Input must be formatted as "owner/repo", e.g. "argumentcomputer/lurk-rs"
      repository:
        required: true
        type: string
      # `gh repo sync` takes a single branch name, so the upstream and the
      # mirror must share it.
      branch:
        required: false
        default: 'main'
        type: string
    secrets:
      TOKEN_APP_ID:
        required: true
      TOKEN_APP_PRIVATE_KEY:
        required: true

# `secrets.GITHUB_TOKEN` cannot carry the `workflow` scope, so it is rejected
# whenever an upstream commit touches `.github/workflows/**`. A GitHub App
# installation token with Workflows: write can push those commits.
permissions: {}

jobs:
  repo-sync:
    name: Sync changes from upstream
    runs-on: ubuntu-latest
    steps:
    - uses: actions/create-github-app-token@v3
      id: generate-token
      with:
        app-id: ${{ secrets.TOKEN_APP_ID }}
        private-key: ${{ secrets.TOKEN_APP_PRIVATE_KEY }}
        permission-contents: write
        permission-workflows: write
    # `github.repository` is the caller's repo, not this one, and the token is
    # scoped to it by default.
    - name: repo-sync
      run: gh repo sync ${{ github.repository }} --source ${INPUTS_REPOSITORY} --branch ${INPUTS_BRANCH} --force
      env:
        GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        INPUTS_REPOSITORY: ${{ inputs.repository }}
        INPUTS_BRANCH: ${{ inputs.branch }}
